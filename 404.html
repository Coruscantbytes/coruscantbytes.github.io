<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Coruscantbytes</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <style>
    .nf {
      min-height: 100svh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 2rem;
    }
    .nf__code {
      font-family: var(--font-display);
      font-size: clamp(4rem, 20vw, 9rem);
      font-weight: 900;
      background: var(--brand-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
  </style>
</head>
<body>
  <main class="nf">
    <div>
      <img src="assets/img/logo.svg" alt="Coruscantbytes" width="90" height="90" style="margin: 0 auto 1rem; filter: drop-shadow(0 0 24px rgba(34,211,238,.4));" />
      <div class="nf__code">404</div>
      <p class="section__lead" style="margin-inline: auto;">This page drifted off the grid.</p>
      <p style="margin-top: 2rem;"><a class="btn btn--primary" href="/">Back home</a></p>
    </div>
  </main>
</body>
</html>
