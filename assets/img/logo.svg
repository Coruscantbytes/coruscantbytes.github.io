<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Coruscantbytes logo">
  <defs>
    <linearGradient id="cb-c" x1="12%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="52%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#e845c4"/>
    </linearGradient>
    <filter id="cb-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g fill="none" stroke="url(#cb-c)" stroke-linecap="round" filter="url(#cb-glow)">
    <!-- main C body -->
    <path d="M48.38 43.47 A20 20 0 1 1 48.38 20.53" stroke-width="7.5"/>
    <!-- inner + outer trace runs -->
    <path d="M43.47 40.03 A14 14 0 1 1 43.47 23.97" stroke-width="1.4" opacity="0.85"/>
    <path d="M53.30 46.91 A26 26 0 1 1 53.30 17.09" stroke-width="1.3" opacity="0.65"/>
    <!-- radial cross links (pink) -->
    <path d="M7.5 25 L13 25" stroke="#e845c4" stroke-width="1.4"/>
    <path d="M6.5 38 L12 38" stroke="#e845c4" stroke-width="1.4"/>
  </g>

  <g filter="url(#cb-glow)">
    <circle cx="32" cy="5" r="1.6" fill="#22d3ee"/>
    <circle cx="7.5" cy="25" r="1.6" fill="#e845c4"/>
    <circle cx="6.5" cy="38" r="1.6" fill="#e845c4"/>
    <circle cx="16" cy="53" r="1.6" fill="#8b5cf6"/>
    <circle cx="43.47" cy="23.97" r="1.5" fill="#22d3ee"/>
  </g>
</svg>
